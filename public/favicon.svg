<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </radialGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo do brasão -->
  <rect width="64" height="64" rx="14" fill="url(#bg)" stroke="#eab308" stroke-width="2"/>

  <!-- Espada Flamejante Central -->
  <g transform="rotate(45 32 32)" filter="url(#glow)">
    <!-- Lâmina -->
    <path d="M30 8 L32 4 L34 8 L33 40 L31 40 Z" fill="url(#blade)"/>
    <!-- Ponta de brilho -->
    <polygon points="32,4 30.5,12 33.5,12" fill="#ffffff"/>
    <!-- Guarda -->
    <rect x="23" y="38" width="18" height="5" rx="2" fill="url(#gold)"/>
    <circle cx="23" cy="40.5" r="2" fill="#fef08a"/>
    <circle cx="41" cy="40.5" r="2" fill="#fef08a"/>
    <!-- Punho -->
    <rect x="30" y="43" width="4" height="11" rx="1" fill="#78350f"/>
    <!-- Pomo -->
    <circle cx="32" cy="56" r="3.5" fill="url(#gold)"/>
  </g>

  <!-- Centelhas místicas -->
  <circle cx="16" cy="18" r="1.5" fill="#67e8f9" opacity="0.8"/>
  <circle cx="48" cy="46" r="1.5" fill="#fef08a" opacity="0.8"/>
</svg>
